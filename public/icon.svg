<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2C0A" />
      <stop offset="100%" stop-color="#241402" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D079" />
      <stop offset="50%" stop-color="#C8922A" />
      <stop offset="100%" stop-color="#9E6E18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner delicate border -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#C8922A" stroke-width="2" stroke-opacity="0.4" />

  <!-- Iconic Stylized Tree & Wood Emblem (High contrast for 48x48 readability) -->
  <g filter="url(#glow)" transform="translate(256, 250)">
    <!-- Top triangle / tier -->
    <path d="M 0 -140 L 65 -45 L 25 -45 L 90 40 L 40 40 L 115 130 L -115 130 L -40 40 L -90 40 L -25 -45 L -65 -45 Z"
          fill="url(#goldGrad)" />

    <!-- Trunk -->
    <rect x="-22" y="130" width="44" height="55" rx="6" fill="url(#goldGrad)" />

    <!-- Wood Ring Core / Accent Accentuation -->
    <circle cx="0" cy="20" r="16" fill="#241402" />
    <circle cx="0" cy="20" r="8" fill="url(#goldGrad)" />
  </g>
</svg>
